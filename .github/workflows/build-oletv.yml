name: Build OLeTV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout OLeTV source
        uses: actions/checkout@v4
        with:
          repository: BKKshixian/anime-extensions
          ref: 125687ae3ed45deb31f3d379c88ce5d40ef79978
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :src:zh:oletv:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OLeTV-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
